# Starts the coding agent when an issue gets the label
# ready-for-agent, or by hand from the Actions tab.
# What the agent does: factory/README.md.
name: Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to work on
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Set by the runner when Qodo's comment shows the gate met.
    outputs:
      pr: ${{ steps.run.outputs.pr }}
      head: ${{ steps.run.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked environment
        run: uv sync --locked

      - name: Create .env for the checks
        run: |
          key=$(python3 -c \
            'import secrets; print(secrets.token_urlsafe(50))')
          {
            echo "DJANGO_SECRET_KEY=$key"
            echo "DJANGO_DEBUG=True"
            echo "DJANGO_ALLOWED_HOSTS="
          } > .env

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      # The runner's local Qodo review (factory/README.md). The
      # same pin as the confirm job; move both together. A failed
      # download only means no local review: the runner says so
      # in the PR, and the PR review is still the gate.
      - name: Install the Qodo CLI (pinned)
        continue-on-error: true
        env:
          QODO_VERSION: 2.6.0
          QODO_SHA256: >-
            0eb4df6a511cb7e170dc3ff8caee751623ccb1a1770157cf7bad96715f509d29
        run: |
          cli="$RUNNER_TEMP/qodo/qodo.mjs"
          mkdir -p "$(dirname "$cli")"
          url="https://get.qodo.ai/releases/$QODO_VERSION/qodo.mjs"
          curl -fsSL -o "$cli" "$url"
          echo "$QODO_SHA256  $cli" | sha256sum -c -
          # The sandbox user may read it, never change it.
          chmod -R go-w "$(dirname "$cli")"
          echo "QODO_CLI_JS=$cli" >> "$GITHUB_ENV"
          echo "QODO_SHA256=$QODO_SHA256" >> "$GITHUB_ENV"

      # Generated code runs as this user and cannot read the
      # job's secrets (factory/README.md, "The sandbox user").
      - name: Create the sandbox user for generated code
        run: |
          user=otahque-sandbox
          sudo useradd --create-home --shell /bin/sh "$user"
          python_dir=$(uv python dir)
          # It must reach the checkout and uv's Python.
          for dir in "$GITHUB_WORKSPACE" "$python_dir"; do
            p="$dir"
            while [ "$p" != / ]; do
              sudo chmod o+x "$p"
              p=$(dirname "$p")
            done
          done
          if [ -d "$python_dir" ]; then
            chmod -R a+rX "$python_dir"
          fi
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          # Sticky, as /tmp is: it may add files at the top level
          # (startapp) but not rename or remove the runner's.
          chmod +t "$GITHUB_WORKSPACE"
          # The runner's own code and Git data are out of reach;
          # .venv stays readable so its Python can start.
          chmod -R go-rwx .git factory .github
          chmod -R go-w .venv
          echo "SANDBOX_USER=$user" >> "$GITHUB_ENV"

      - name: Run the agent
        id: run
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          REPO: ${{ github.repository }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: >-
            ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          # The runner stops when this is false: see
          # token_problem() in factory/agent_runner.py.
          AGENT_TOKEN_SET: ${{ secrets.AGENT_GH_TOKEN != '' }}
          # Only qodo() passes these on, to the pinned CLI; the
          # generated code runs as the sandbox user, which
          # cannot read this process's environment.
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          QODO_BASE_URL: ${{ vars.QODO_BASE_URL }}
          LOCAL_REVIEW_ROUNDS: "2"
          EURI_API_KEY: ${{ secrets.EURI_API_KEY }}
          EURI_MODEL: ${{ vars.EURI_MODEL }}
          EURI_BASE_URL: ${{ vars.EURI_BASE_URL }}
          # Each raw model reply, outside the checkout (#78).
          REPLIES: ${{ runner.temp }}/factory-replies.md
          REFERENCE_REPO: ${{ vars.REFERENCE_REPO }}
          REFERENCE_REF: ${{ vars.REFERENCE_REF }}
          MAX_ATTEMPTS: "5"
          TEST_ATTEMPTS: "5"
          REVIEW_ROUNDS: "2"
          QODO_WAIT_MINUTES: "20"
          RUN_MINUTES: "75"
        run: python3 factory/agent_runner.py

      # The runner stops itself at RUN_MINUTES; this covers a
      # job that was cancelled or hit timeout-minutes anyway.
      - name: Report a cancelled or timed-out run
        if: cancelled()
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" \
            --add-label agent-blocked \
            --remove-label agent-working
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" \
            --body "The agent run was cancelled or timed out: \
          $RUN_URL"

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: |
            factory-log.md
            ${{ runner.temp }}/factory-replies.md
          if-no-files-found: ignore

  # Confirms the gate in Qodo's records (factory/confirm_gate.py)
  # on a fresh machine: no generated code runs here, so the Qodo
  # key never shares a machine with the model's code.
  confirm:
    needs: agent
    if: needs.agent.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Always main's code, even when the workflow was started by
      # hand from another branch: this job holds the Qodo key.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      # Qodo's own installer always takes the newest release, so
      # the CLI is downloaded at a pinned version and checked
      # against Qodo's published hash. Move both in a reviewed PR.
      - name: Install the Qodo CLI (pinned)
        id: cli
        env:
          QODO_VERSION: 2.6.0
          QODO_SHA256: >-
            0eb4df6a511cb7e170dc3ff8caee751623ccb1a1770157cf7bad96715f509d29
        run: |
          cli="$RUNNER_TEMP/qodo/qodo.mjs"
          mkdir -p "$(dirname "$cli")"
          url="https://get.qodo.ai/releases/$QODO_VERSION/qodo.mjs"
          curl -fsSL -o "$cli" "$url"
          echo "$QODO_SHA256  $cli" | sha256sum -c -
          echo "QODO_CLI_JS=$cli" >> "$GITHUB_ENV"
          echo "QODO_SHA256=$QODO_SHA256" >> "$GITHUB_ENV"

      - name: Check Qodo's records of the PR
        env:
          PR: ${{ needs.agent.outputs.pr }}
          HEAD: ${{ needs.agent.outputs.head }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          REPO: ${{ github.repository }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          QODO_BASE_URL: ${{ vars.QODO_BASE_URL }}
        run: python3 factory/confirm_gate.py

      # confirm_gate.py reports its own failures; this covers a
      # CLI download or hash check that stopped the job first.
      - name: Report a failed CLI install
        if: failure() && steps.cli.outcome == 'failure'
        env:
          PR: ${{ needs.agent.outputs.pr }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
        run: |
          text="Gate not met: the pinned Qodo CLI could not be"
          text="$text installed or did not match its hash, so"
          text="$text Qodo's records were not checked. $RUN_URL"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
            --body "$text"
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" \
            --add-label agent-blocked
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" \
            --body "The agent stopped and needs help. $text"
